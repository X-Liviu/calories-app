name: DevOps pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. LINT: Se ejecuta primero. Si falla, nada más corre.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: "20"
      - run: npm ci
      - run: npm run lint

  # 2. TEST BACKEND: Depende de 'lint'. Corre en paralelo con Frontend.
  test_backend:
    needs: [lint]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: "20"
      - run: npm ci

      - name: Run Backend Tests
        run: npm test -w backend
        env:
          # Aquí inyectamos las variables "invisibles"
          MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
          SECRET: ${{ secrets.SECRET }}
          NODE_ENV: test

  # 3. TEST FRONTEND: Depende de 'lint'. Corre en paralelo con Backend.
  test_frontend:
    needs: [lint]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: "20"
      - run: npm ci

      - name: Run Frontend Tests
        run: npm test -w frontend

  # 4. TEST E2E: Ejecuta Playwright.
  test_e2e:
    needs: [test_backend, test_frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: "20"

      - run: npm ci

      - name: Install Playwright Browsers
        run: npm exec -w e2e -- playwright install --with-deps

      - name: Run E2E Tests
        run: npm test -w e2e
        env:
          MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
          SECRET: ${{ secrets.SECRET }}
          NODE_ENV: test
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
